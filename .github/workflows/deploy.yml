name: My portfolio on Deployed to Vercel

on:
  push:
    branches:
      - new_design  #this is the branch I use you can change this to your target branch name if you need Github Action

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20  # Match your local Node.js version

      - name: Install dependencies
        run: pnpm install

      - name: Run lint
        run: pnpm run lint
        
      - name: Build the project
        run: pnpm run build

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./
          alias-domains: kherleefer.vercel.app  # optional but I inserted mine
